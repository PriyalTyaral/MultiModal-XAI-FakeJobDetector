spring.application.name=random_major

# MongoDB Connection
spring.data.mongodb.uri=mongodb://localhost:27017/fakejobdetectordb
spring.data.mongodb.database=fakejobdetectordb

# Server Port
server.port=8081

# ── LIME Microservice ────────────────────────────────────────
lime.service.url=http://localhost:5002
lime.num-features=10
lime.output-format=json
lime.timeout-ms=10000

# JSON Serialization
spring.jackson.serialization.write-dates-as-timestamps=false

# Caffeine cache for LIME explanations
lime.cache.max-size=500
lime.cache.ttl-minutes=60

# ── Google Cloud Platform (leave blank = offline mode) ───────
gcp.project-id=
gcp.bucket-name=
gcp.credentials-path=

# ── Spring Actuator (exposes /actuator/metrics for monitoring) ──
management.endpoints.web.exposure.include=health,info,metrics,caches
management.endpoint.health.show-details=always

# ── Logging ──
logging.level.org.springframework.web.servlet.DispatcherServlet=DEBUG
logging.level.com.example.random_major=DEBUG
